name: Question B checks
on: [push, pull_request]

jobs:
  release-integrity:
    name: Evidence, syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - name: Keep unpublished article drafts out of Git
        run: test -z "$(git ls-files docs/drafts/)"
      - name: Lint active code and sealed sources
        run: uvx --python 3.12 ruff==0.16.8 check .
      - name: Verify all releases, source seals and historical evidence
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/reproduce_receiver_mlp.py --verify-only --history --plan
      - name: Verify local concentration diagnostic and reader-figure provenance
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_reader_guide.py
      - name: Verify normalization interventions and retained failed accounts
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_normalization.py
      - name: Verify local mixing interventions and finite-activation controls
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_transmission.py
      - name: Verify finite correction-field factorial and retained failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_fields.py
      - name: Verify amplitude/direction test and globally sealed fresh prediction
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_amplitude.py
      - name: Verify common-backbone interventions and controller clamps
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_backbone.py
      - name: Verify causal-cache baseline, timing and research-program review
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_cache.py
      - name: Verify native source-value interchange and retained failed primary
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_native_values.py
      - name: Verify source reanchoring, geometry controls and retained failed primary
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_reanchoring.py
      - name: Verify source probability/self-value factorial and signed ledgers
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source_reading.py
      - name: Verify first-source MLP predictions, fresh receipt and failed stronger accounts
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_first_mlp.py
      - name: Verify source primitive factorial, signed interventions and failed primary
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source_primitives.py
      - name: Verify fresh source-activation predictions and retained effect failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source_activation.py
      - name: Verify source composition, preserved storage failure and raw numerical failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source_composition.py
      - name: Verify source2 products, failed primary and original audit qualification
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source2_products.py
      - name: Verify source2 carry/read generation and retained numerical and paired failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_source_origin.py
      - name: Verify immutable pre-native carried-response forecasts and source seals
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_carried_forecasts.py
      - name: Verify retrospective carried-state prediction, controls and limits
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_carried_results.py --experiment 283
      - name: Verify sealed fresh carried-state outcomes and exact partial replay
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify_carried_results.py --experiment 284
      - name: Verify sealed structural native-source forecasts before True
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify285.py --phase forecast
      - name: Verify structural native outcomes and failed stronger repair
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify285.py --phase complete
      - name: Verify retrospective readout predictions and retained numerical failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify286.py
      - name: Verify source-receiver factorial and retained failed numerical gate
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify287.py
      - name: Verify finite response-map diagnostic, interactions and retained coordinate failures
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify288.py
      - name: Verify failed attention-interface account and primitive qualifications
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify289.py
      - name: Verify receiving gated-MLP account, normalizer control and numerical limits
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify290.py
      - name: Verify receiving coefficient interventions, shuffled controls and numerical limits
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/verify291.py
      - name: Compile published Python sources without model imports
        run: uv run --no-project --python 3.12 python -m compileall -q research/boolean_coupling results/baseline-interaction-225b/frozen-225/research/boolean_coupling results/baseline-interaction-225b/frozen-225b/research/boolean_coupling
