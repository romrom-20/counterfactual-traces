name: Question B checks
on: [push, pull_request]

jobs:
  release-integrity:
    name: Evidence, syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - name: Keep unpublished article drafts out of Git
        run: test -z "$(git ls-files docs/drafts/)"
      - name: Lint active code and sealed sources
        run: uvx --python 3.12 ruff==0.16.8 check .
      - name: Verify all releases, source seals and historical evidence
        run: uv run --no-project --python 3.12 python -S research/boolean_coupling/reproduce_failure.py --verify-only --history --plan
      - name: Compile published Python sources without model imports
        run: uv run --no-project --python 3.12 python -m compileall -q research/boolean_coupling results/baseline-interaction-225b/frozen-225/research/boolean_coupling results/baseline-interaction-225b/frozen-225b/research/boolean_coupling
